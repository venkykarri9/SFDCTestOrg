<template>
    <lightning-card title="Deal Summary" icon-name="standard:opportunity">
        <template lwc:if={isLoading}>
            <div class="slds-align_absolute-center slds-p-around_medium">
                <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
            </div>
        </template>
        <template lwc:else>
            <div class="slds-p-around_medium">
                <div class="slds-grid slds-gutters slds-wrap">
                    <div class="slds-col slds-size_1-of-2 slds-p-bottom_small">
                        <div class="slds-text-title slds-text-color_weak">Total Deals</div>
                        <div class="slds-text-heading_medium">{summary.totalDeals}</div>
                    </div>
                    <div class="slds-col slds-size_1-of-2 slds-p-bottom_small">
                        <div class="slds-text-title slds-text-color_weak">Total Value</div>
                        <div class="slds-text-heading_medium">{formattedTotalValue}</div>
                    </div>
                    <div class="slds-col slds-size_1-of-2 slds-p-bottom_small">
                        <div class="slds-text-title slds-text-color_weak">Weighted Value</div>
                        <div class="slds-text-heading_medium">{formattedWeightedValue}</div>
                    </div>
                    <div class="slds-col slds-size_1-of-2 slds-p-bottom_small">
                        <div class="slds-text-title slds-text-color_weak">Closed Won</div>
                        <div class="slds-text-heading_medium slds-text-color_success">{summary.closedWon}</div>
                    </div>
                </div>
                <template lwc:if={hasDeals}>
                    <div class="slds-p-top_small">
                        <lightning-button
                            label="View All Deals"
                            onclick={handleViewAllDeals}
                            variant="brand-outline">
                        </lightning-button>
                    </div>
                </template>
            </div>
        </template>
    </lightning-card>
</template>
